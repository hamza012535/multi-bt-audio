name: Build Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example v0.1.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --clean --noconfirm --onefile --console --name multi-bt-audio --collect-binaries pyaudiowpatch multi_bt_audio.py

      - name: Upload executable for build verification
        uses: actions/upload-artifact@v4
        with:
          name: multi-bt-audio-windows
          path: dist/multi-bt-audio.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: multi-bt-audio ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist/multi-bt-audio.exe
