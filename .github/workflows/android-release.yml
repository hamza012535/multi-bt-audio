name: Android Release APK
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Decode optional release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/release-keystore.jks" >> "$GITHUB_ENV"
      - name: Build installable release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Prepare APK and checksum
        run: |
          mkdir -p release-assets
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then APK=app/build/outputs/apk/release/app-release-unsigned.apk; fi
          cp "$APK" release-assets/multi-bt-audio-release.apk
          cd release-assets
          sha256sum multi-bt-audio-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/multi-bt-audio-release.apk
            release-assets/SHA256SUMS.txt
